<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Secure Login App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>
<body>
  <main class="container" style="max-width: 500px; margin-top: 80px;">
    <article>
      <header>
        <h2 style="margin-bottom: 0;">Log in</h2>
      </header>

      {% if message %}
        <p style="background-color: var(--card-sectionning-background-color); border-left: 4px solid var(--primary); padding: 0.75rem; border-radius: 4px; font-weight: 500;">
          {{ message }}
        </p>
      {% endif %}

      <form method="post">
        <label for="username">Username
          <input type="text" id="username" name="username" required autocomplete="username">
        </label>
        
        <label for="password">Password
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </label>

        <button type="submit" style="margin-top: 1rem;">Log in</button>
      </form>

      <footer style="text-align: center;">
        <small><a href="/register">Need an account? Register</a></small>
      </footer>
    </article>
  </main>
</body>
</html>
